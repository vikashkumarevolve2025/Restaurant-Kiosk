name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: pip install -r requirements.txt -r requirements-printer.txt pyinstaller

      - name: Build the program
        run: pyinstaller packaging/orderdesk.spec --noconfirm --distpath dist --workpath build

      - name: Check the built program starts and takes an order
        shell: pwsh
        run: |
          $env:ORDERDESK_DATA = "$PWD\smoketest-data"
          $p = Start-Process -FilePath "dist\OrderDesk\OrderDesk.exe" -ArgumentList "--no-browser" -PassThru
          $up = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 1
            try { if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/healthz).StatusCode -eq 200) { $up = $true; break } } catch {}
          }
          if (-not $up) { Stop-Process -Id $p.Id -Force; throw "The program did not start." }
          try {
            foreach ($path in @("/", "/setup", "/kitchen", "/admin")) {
              $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8000$path"
              if ($r.StatusCode -ne 200) { throw "$path returned $($r.StatusCode)" }
            }
            $menu = Invoke-RestMethod http://127.0.0.1:8000/api/menu
            if ($menu.items.Count -lt 1) { throw "The menu is empty." }
            $body = '{"name":"Smoke Test","phone":"9876543210","order_type":"Takeaway","items":[{"id":"s1","qty":1}]}'
            $o = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8000/api/orders -ContentType "application/json" -Body $body
            if ($o.token -ne 1 -or $o.total -le 0) { throw "The test order was not accepted." }
            Write-Host "Program OK: token $($o.token), total $($o.total)"
          } finally { Stop-Process -Id $p.Id -Force }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        shell: pwsh
        run: |
          $v = (Select-String -Path app/__init__.py -Pattern '__version__ = "(.+)"').Matches.Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\orderdesk.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: OrderDesk-Windows-Installer
          path: packaging/Output/*.exe
